services:
  postgres:
    image: postgres:16-alpine
    container_name: signals-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signals_inventory}
      POSTGRES_USER: ${POSTGRES_USER:-signals_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signals_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-signals_user} -d ${POSTGRES_DB:-signals_inventory}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - signals-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: signals-backend
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-signals_inventory}
      DB_USER: ${POSTGRES_USER:-signals_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-signals_pass}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped
    networks:
      - signals-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: signals-frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - signals-net

volumes:
  postgres_data:

networks:
  signals-net:
    driver: bridge
